[project]
name = "saletool"
version = "0.1.0"
description = "Find matching companies on LinkedIn through legitimate data providers and retrieve senior contacts."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "click>=8.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "PyJWT>=2.8",
    "cryptography>=42.0",
    "trafilatura>=1.12",
]

[project.optional-dependencies]
mongo = ["pymongo>=4.6"]
browser = ["playwright>=1.48"]

[project.scripts]
saletool = "saletool.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["saletool*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# BLE is a primary reason for enabling Ruff: some broad Exception catches are
# intentional (one failed company must not fail the entire job) and marked with
# `# noqa: BLE001`. Without this rule, those markers are meaningless and
# unintended broad catches would go unnoticed.
select = ["F", "E", "W", "I", "UP", "B", "BLE", "SIM", "RUF"]
ignore = [
    "E501",    # Let the formatter handle line length; do not block commits for two extra characters.
    "RUF001",  # Vietnamese diacritics are flagged as ambiguous characters.
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Tests use fixtures and mocks, so some parameters are intentionally unused.
"tests/*" = ["ARG001", "ARG002"]
