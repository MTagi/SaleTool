[project]
name = "saletool"
version = "0.1.0"
description = "Tìm công ty phù hợp trên LinkedIn (qua nhà cung cấp dữ liệu hợp pháp) và lấy danh sách liên hệ cấp cao."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "click>=8.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "PyJWT>=2.8",
]

[project.optional-dependencies]
mongo = ["pymongo>=4.6"]

[project.scripts]
saletool = "saletool.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["saletool*"]
