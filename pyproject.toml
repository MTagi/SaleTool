[project]
name = "saletool"
version = "0.1.0"
description = "Tìm công ty phù hợp trên LinkedIn (qua nhà cung cấp dữ liệu hợp pháp) và lấy danh sách liên hệ cấp cao."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "click>=8.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "PyJWT>=2.8",
    "cryptography>=42.0",
    "trafilatura>=1.12",
]

[project.optional-dependencies]
mongo = ["pymongo>=4.6"]
browser = ["playwright>=1.44"]

[project.scripts]
saletool = "saletool.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["saletool*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# BLE là lý do chính bật ruff: code có nhiều chỗ bắt Exception có chủ đích (1 công
# ty lỗi không được làm hỏng cả job) và đã đánh dấu `# noqa: BLE001`. Không bật
# rule thì những dòng noqa đó vô nghĩa, và chỗ bắt rộng KHÔNG chủ đích cũng lọt.
select = ["F", "E", "W", "I", "UP", "B", "BLE", "SIM", "RUF"]
ignore = [
    "E501",    # độ dài dòng để formatter lo, không chặn commit vì thừa 2 ký tự
    "RUF001",  # dấu tiếng Việt bị coi là "ký tự dễ nhầm"
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Test dùng fixture và hàm giả lập nên có tham số không đụng tới.
"tests/*" = ["ARG001", "ARG002"]
