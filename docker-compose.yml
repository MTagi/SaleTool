# SaleTool / ABIM Sales Assistant.
#
# Default: backend (FastAPI) + prebuilt React frontend (served by nginx),
# with SQLite data on a volume. Mongo is an optional profile.
#
# Note: the application itself does NOT read .env. Docker Compose reads it,
# substitutes ${...} below, and passes the values into containers as environment
# variables.
name: saletool

services:
  backend:
    build:
      context: .
      args:
        # true = install Playwright + Chromium for the JavaScript-rendering fallback.
        INSTALL_BROWSER: ${SALETOOL_INSTALL_BROWSER:-false}
    environment:
      # Required and must remain FIXED between restarts: the database encryption
      # key is derived from this value using HKDF, and JWTs are signed with it.
      # Changing it requires everyone to log in again and re-enter API keys in
      # Settings. The `:?` syntax makes Compose stop with a clear message instead
      # of silently using a temporary server-generated key.
      SALETOOL_SECRET_KEY: "${SALETOOL_SECRET_KEY:?set SALETOOL_SECRET_KEY in .env before starting Docker Compose}"

      SALETOOL_DB_BACKEND: ${SALETOOL_DB_BACKEND:-sqlite}
      SALETOOL_DB_PATH: /data/saletool.db
      SALETOOL_MONGO_URI: ${SALETOOL_MONGO_URI:-mongodb://mongo:27017}
      SALETOOL_MONGO_DB: ${SALETOOL_MONGO_DB:-saletool}

      # UI and API share an origin through nginx, so CORS is unnecessary. This
      # list is only for `npm run dev` on the host, pointing to this API.
      SALETOOL_CORS_ORIGINS: ${SALETOOL_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}

      # CLI only. The web UI receives an Apollo key per request through the form.
      APOLLO_API_KEY: ${APOLLO_API_KEY:-}
    volumes:
      - saletool-data:/data
    ports:
      # Expose on loopback only: users access the app through the frontend, while
      # this port is for curl and /docs during debugging. Remove if unnecessary.
      - "127.0.0.1:${SALETOOL_API_PORT:-8000}:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "${SALETOOL_WEB_PORT:-8080}:80"
    depends_on:
      backend:
        # Wait for the healthcheck: nginx resolves "backend" at startup and exits
        # if it is unavailable instead of retrying.
        condition: service_healthy
    restart: unless-stopped

  # --- Optional: run with `--profile mongo` -------------------------------
  # Also set SALETOOL_DB_BACKEND=mongo. Do not add Mongo to the backend's
  # depends_on; that would make this profile mandatory and break the default
  # SQLite path. pymongo connects lazily, so the backend may start first.
  mongo:
    image: mongo:7
    profiles: ["mongo"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 12
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  saletool-data:
  mongo-data:
