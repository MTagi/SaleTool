server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite hashes asset filenames, so they can be cached indefinitely. Do not
    # cache index.html, or users may keep the old version after deployment.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        # nginx resolves an upstream name ONCE at startup and keeps that IP.
        # When the backend is recreated (profile change or `up -d` after env edits),
        # it gets a new IP while nginx keeps using the old one, returning 502 until
        # nginx restarts. Using a variable in proxy_pass makes nginx re-resolve DNS
        # according to the TTL below; 127.0.0.11 is Docker's internal DNS.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $saletool_backend http://backend:8000;
        proxy_pass $saletool_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # POST /api/search runs SYNCHRONOUSLY: it calls Apollo for companies and
        # then searches contacts for each company, which may take minutes for a
        # large list. nginx's default 60s timeout would return 504 even while the
        # backend is still running. Enrichment/matching/messaging jobs run in the
        # background and do not need this timeout.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # React Router uses the History API: direct navigation to /matching or a
    # mid-session refresh must return index.html, or nginx looks for a file and returns 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
