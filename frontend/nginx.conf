server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite băm tên file asset nên cache vĩnh viễn được; index.html thì không,
    # nếu không người dùng vẫn giữ bản cũ sau khi deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        # nginx phân giải tên upstream MỘT LẦN lúc khởi động và nhớ luôn IP đó.
        # Khi backend được dựng lại (đổi profile, `up -d` sau khi sửa env) nó nhận
        # IP mới còn nginx vẫn gõ vào IP cũ -> 502 cho tới khi restart nginx.
        # Đặt proxy_pass qua biến buộc nginx tra lại DNS theo TTL bên dưới;
        # 127.0.0.11 là DNS nội bộ của Docker.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $saletool_backend http://backend:8000;
        proxy_pass $saletool_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # POST /api/search chạy ĐỒNG BỘ: gọi Apollo tìm công ty rồi lặp tìm liên
        # hệ từng công ty, có thể mất vài phút với danh sách lớn. Timeout mặc
        # định 60s của nginx sẽ cắt ngang giữa chừng và trả 504 dù backend vẫn
        # đang chạy. Các job enrich/match/message thì chạy nền nên không cần.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # React Router dùng history API: mở thẳng /matching hay bấm F5 giữa chừng
    # phải trả về index.html, nếu không nginx tìm file thật và trả 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
